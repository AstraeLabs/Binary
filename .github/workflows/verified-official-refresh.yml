name: Refresh verified official binaries (security branch)

on:
  push:
    branches:
      - security/official-binaries-2026-10-26
    paths:
      - .github/workflows/verified-official-refresh.yml

permissions:
  contents: write

concurrency:
  group: verified-official-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Download, hash-verify, audit, and commit official artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout branch and Git LFS binaries
        uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.BINARY_PUSH_TOKEN || github.token }}

      - name: Verify Git LFS objects
        run: git lfs fsck --objects

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install downloader dependencies
        run: python -m pip install requests

      - name: Validate integrity enforcement and downloader
        run: |
          python -m py_compile .github/workflows/scripts/download_binaries.py
          python -m unittest discover -s security -p "test_*.py" -v

      - name: Download verified official artifacts
        env:
          YT_DLP_VERSION: "2026.10.21"
          MKVTOOLNIX_VERSION: "103.0"
          DENO_VERSION: "v2.9.8"
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/workflows/scripts/download_binaries.py --only "yt-dlp,mkvtoolnix,deno"

      - name: Check versions and bit-identical vendor releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(cat binaries/yt-dlp.version)" = "2026.10.21"
          test "$(cat binaries/mkvtoolnix.version)" = "103.0"
          test "$(cat binaries/deno.version)" = "v2.9.8"
          python security/audit_snapshot.py --strict
          python security/audit_all_binaries.py --enforce
          git diff --check

      - name: Commit only audited official binaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install --local
          git add binaries binary_paths.json
          if git diff --cached --quiet; then
            echo "All selected binaries already match the approved official releases." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "fix(binaries): refresh verified yt-dlp 2026.10.21, MKVToolNix 103.0 and Deno 2.9.8"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Verified source-pinned executable updates committed to ${GITHUB_REF_NAME}." >> "$GITHUB_STEP_SUMMARY"
