name: Update FFmpeg / Bento4 / Shaka Packager / dovi_tool / MKVToolNix / Velora binaries

on:
  schedule:
    # Every Monday at 04:00 UTC
    - cron: '0 4 * * 1'

  workflow_dispatch:
    inputs:
      tool:
        description: 'Tool to update (use "velora" for a manual Velora-only sync)'
        type: choice
        default: 'all'
        options:
          - all
          - ffmpeg
          - bento4
          - shaka
          - dovi_tool
          - mkvtoolnix
          - velora
      force:
        description: 'Force the download even if the version has not changed'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-media-binaries
  cancel-in-progress: false

jobs:
  check:
    name: Check for new versions
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.check.outputs.any_changed }}
      ffmpeg_changed: ${{ steps.check.outputs.ffmpeg_changed }}
      ffmpeg_latest: ${{ steps.check.outputs.ffmpeg_latest }}
      bento4_changed: ${{ steps.check.outputs.bento4_changed }}
      bento4_latest: ${{ steps.check.outputs.bento4_latest }}
      shaka_changed: ${{ steps.check.outputs.shaka_changed }}
      shaka_latest: ${{ steps.check.outputs.shaka_latest }}
      dovi_tool_changed: ${{ steps.check.outputs.dovi_tool_changed }}
      dovi_tool_latest: ${{ steps.check.outputs.dovi_tool_latest }}
      mkvtoolnix_changed: ${{ steps.check.outputs.mkvtoolnix_changed }}
      mkvtoolnix_latest: ${{ steps.check.outputs.mkvtoolnix_latest }}
      velora_changed: ${{ steps.check.outputs.velora_changed }}
      velora_latest: ${{ steps.check.outputs.velora_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Check versions
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VELORA_GITHUB_TOKEN: ${{ secrets.VELORA_RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
        run: python .github/workflows/scripts/check_versions.py

      - name: Summary
        run: |
          echo "### Binary version check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tool | Changed | Latest version |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| FFmpeg | ${{ steps.check.outputs.ffmpeg_changed }} | ${{ steps.check.outputs.ffmpeg_latest }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bento4 | ${{ steps.check.outputs.bento4_changed }} | ${{ steps.check.outputs.bento4_latest }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Shaka Packager | ${{ steps.check.outputs.shaka_changed }} | ${{ steps.check.outputs.shaka_latest }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| dovi_tool | ${{ steps.check.outputs.dovi_tool_changed }} | ${{ steps.check.outputs.dovi_tool_latest }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| MKVToolNix | ${{ steps.check.outputs.mkvtoolnix_changed }} | ${{ steps.check.outputs.mkvtoolnix_latest }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Velora | ${{ steps.check.outputs.velora_changed }} | ${{ steps.check.outputs.velora_latest }} |" >> "$GITHUB_STEP_SUMMARY"

  update:
    name: Download and publish updated binaries
    needs: check
    if: >-
      needs.check.outputs.any_changed == 'true' ||
      github.event.inputs.force == 'true' ||
      (github.event.inputs.tool != '' && github.event.inputs.tool != 'all')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.BINARY_PUSH_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Determine which tools to update
        id: which
        env:
          TOOL_INPUT: ${{ github.event.inputs.tool }}
          FORCE_INPUT: ${{ github.event.inputs.force }}
          FFMPEG_CHANGED: ${{ needs.check.outputs.ffmpeg_changed }}
          BENTO4_CHANGED: ${{ needs.check.outputs.bento4_changed }}
          SHAKA_CHANGED: ${{ needs.check.outputs.shaka_changed }}
          DOVI_TOOL_CHANGED: ${{ needs.check.outputs.dovi_tool_changed }}
          MKVTOOLNIX_CHANGED: ${{ needs.check.outputs.mkvtoolnix_changed }}
          VELORA_CHANGED: ${{ needs.check.outputs.velora_changed }}
        run: |
          # A specific tool picked from the workflow_dispatch dropdown always
          # wins (this is the manual "update Velora" button use case).
          if [ -n "$TOOL_INPUT" ] && [ "$TOOL_INPUT" != "all" ]; then
            only="$TOOL_INPUT"
          else
            only=""
            for pair in "ffmpeg:$FFMPEG_CHANGED" "bento4:$BENTO4_CHANGED" "shaka:$SHAKA_CHANGED" \
                        "dovi_tool:$DOVI_TOOL_CHANGED" "mkvtoolnix:$MKVTOOLNIX_CHANGED" "velora:$VELORA_CHANGED"; do
              name="${pair%%:*}"
              changed="${pair##*:}"
              if [ "$changed" = "true" ] || [ "$FORCE_INPUT" = "true" ]; then
                only="${only}${name},"
              fi
            done
            only="${only%,}"
          fi
          echo "Selected tools: $only"
          echo "only=$only" >> "$GITHUB_OUTPUT"

      - name: Download updated binaries
        env:
          FFMPEG_VERSION: ${{ needs.check.outputs.ffmpeg_latest }}
          BENTO4_VERSION: ${{ needs.check.outputs.bento4_latest }}
          SHAKA_PACKAGER_VERSION: ${{ needs.check.outputs.shaka_latest }}
          DOVI_TOOL_VERSION: ${{ needs.check.outputs.dovi_tool_latest }}
          MKVTOOLNIX_VERSION: ${{ needs.check.outputs.mkvtoolnix_latest }}
          VELORA_VERSION: ${{ needs.check.outputs.velora_latest }}
          VELORA_GITHUB_TOKEN: ${{ secrets.VELORA_RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
        run: python .github/workflows/scripts/download_binaries.py --only "${{ steps.which.outputs.only }}"

      - name: Commit & push
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain binaries binary_paths.json)" ]; then
            echo "No changes — binaries already up to date."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git lfs install
          git add .gitattributes binaries binary_paths.json

          msg="chore(binaries): weekly update"
          [ "${{ needs.check.outputs.ffmpeg_changed }}" = "true" ] && msg="${msg}
          - FFmpeg -> ${{ needs.check.outputs.ffmpeg_latest }}"
          [ "${{ needs.check.outputs.bento4_changed }}" = "true" ] && msg="${msg}
          - Bento4 -> ${{ needs.check.outputs.bento4_latest }}"
          [ "${{ needs.check.outputs.shaka_changed }}" = "true" ] && msg="${msg}
          - Shaka Packager -> ${{ needs.check.outputs.shaka_latest }}"
          [ "${{ needs.check.outputs.dovi_tool_changed }}" = "true" ] && msg="${msg}
          - dovi_tool -> ${{ needs.check.outputs.dovi_tool_latest }}"
          [ "${{ needs.check.outputs.mkvtoolnix_changed }}" = "true" ] && msg="${msg}
          - MKVToolNix -> ${{ needs.check.outputs.mkvtoolnix_latest }}"
          [ "${{ needs.check.outputs.velora_changed }}" = "true" ] && msg="${msg}
          - Velora -> ${{ needs.check.outputs.velora_latest }}"

          git commit -m "$msg"
          git push

          echo "### Binaries updated :rocket:" >> "$GITHUB_STEP_SUMMARY"
